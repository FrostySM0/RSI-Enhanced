<!doctype html><html><head><title>Enhanced block fixture</title><link rel="stylesheet" href="/spectrum.css"><style>body{margin:30px;background:#0f141b;color:#e6edf3;font:15px Arial}.member-profile,.blocked-users{padding:16px;margin-bottom:20px;border:1px solid #3c5065}.table-row{display:flex;gap:20px;padding:12px}.table-cell{flex:1}.content-main{padding:18px;background:#161e28}.content-header{margin-bottom:12px}.forum-thread-item-children-replies{margin-left:30px}.profile-action{cursor:pointer}</style></head><body><h1>Synthetic enhanced block fixture</h1><p>No live account actions.</p><button id="late">Insert later J3PT reply</button><div id="react"><div class="member-profile"><div class="profile-member-nickname">@PilotHidden</div><span class="member-name"><span class="displayname">Hidden Pilot</span></span><div class="profile-actions"><button class="profile-action" id="native-block">Block</button><a class="profile-action" href="#posts">View posts</a></div></div><div class="blocked-users"><div class="table-row"><div class="table-cell"><div class="blocked-users__profile"><span class="member-name"><span class="displayname">J3PT</span></span></div></div><div class="table-cell">J3PT</div><div class="table-cell">Organizations</div><div class="table-cell"><button>Unblock</button></div></div></div><div id="page" class="forum-thread"><div class="forum-thread-replies"><div class="forum-thread-item" id="j3pt"><div class="content"><div class="content-main"><header class="content-header"><span class="member-name"><span class="displayname">J3PT</span><span class="nickname">@J3PT</span></span></header><p>J3PT post to remove.</p></div><div class="forum-thread-item-children-replies"><div class="forum-thread-item" id="other"><div class="content"><div class="content-main"><header class="content-header"><span class="member-name"><span class="displayname">Other Pilot</span><span class="nickname">@OtherPilot</span></span></header><p>Keep this reply from another user visible.</p></div></div></div></div></div></div><div class="forum-thread-item" id="pilot"><div class="content"><div class="content-main"><header class="content-header"><span class="member-name"><span class="displayname">Hidden Pilot</span><span class="nickname">@PilotHidden</span></span></header><p>Post controlled by the profile menu.</p></div></div></div></div></div></div><script>document.getElementById('native-block').onclick=function(){this.textContent=this.textContent==='Block'?'Unblock':'Block'};document.getElementById('late').onclick=()=>{const node=document.getElementById('j3pt').cloneNode(true);node.id='late-post';node.querySelector('.forum-thread-item-children-replies').remove();document.querySelector('.forum-thread-replies').append(node)};</script></body></html>
